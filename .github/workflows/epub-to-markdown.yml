name: Convert EPUBs to Markdown

on:
  push:
    branches: [main]
    paths:
      - "epub-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install ebooklib beautifulsoup4 markdownify

      - name: Convert uploaded EPUBs to Markdown
        run: |
          mkdir -p epub-output
          for f in epub-input/*.epub; do
            [ -e "$f" ] || continue
            base=$(basename "${f%.epub}")
            python3 tools/epub_to_markdown.py "$f" -o "epub-output/${base}.md"
          done

      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'epub-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded EPUBs to Markdown [skip ci]"
            git push
          fi
