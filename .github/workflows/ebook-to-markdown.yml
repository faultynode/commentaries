name: Convert Ebooks to Markdown

on:
  push:
    branches: [main]
    paths:
      - "ebook-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y djvulibre-bin
          pip install mobi ebooklib beautifulsoup4 markdownify

      - name: Convert uploaded ebooks to Markdown
        run: |
          mkdir -p ebook-output
          failed=()
          for f in ebook-input/*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.epub) script=tools/epub_to_markdown.py ;;
              *.azw3) script=tools/azw3_to_markdown.py ;;
              *.djvu) script=tools/djvu_to_markdown.py ;;
              *) continue ;;
            esac
            base=$(basename "$f")
            base="${base%.*}"
            if ! python3 "$script" "$f" -o "ebook-output/${base}.md"; then
              echo "::error::Failed to convert $f"
              failed+=("$f")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed to convert ${#failed[@]} file(s):"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Commit converted files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'ebook-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded ebooks to Markdown [skip ci]"
            git push
          fi
