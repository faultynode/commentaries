name: Convert PDFs to Markdown

on:
  push:
    branches: [main]
    paths:
      - "pdf-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pymupdf ollama

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434 >/dev/null && break
            sleep 1
          done
          ollama pull minicpm-v

      - name: Convert uploaded PDFs to Markdown
        run: |
          mkdir -p pdf-output
          for f in pdf-input/*.pdf; do
            [ -e "$f" ] || continue
            base=$(basename "${f%.pdf}")
            python3 tools/pdf_extractor.py "$f" --provider ollama --model minicpm-v -o "pdf-output/${base}.md"
          done

      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'pdf-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded PDFs to Markdown [skip ci]"
            git push
          fi
