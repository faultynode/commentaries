name: Convert PDFs to Markdown

on:
  push:
    branches: [main]
    paths:
      - "pdf-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pymupdf openai

      - name: Convert uploaded PDFs to Markdown
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p pdf-output
          for f in pdf-input/*.pdf; do
            [ -e "$f" ] || continue
            base=$(basename "${f%.pdf}")
            python3 tools/pdf_extractor.py "$f" --provider openai -o "pdf-output/${base}.md"
          done

      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'pdf-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded PDFs to Markdown [skip ci]"
            git push
          fi
