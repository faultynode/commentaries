name: Convert PDFs to Markdown

on:
  push:
    branches: [main]
    paths:
      - "pdf-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pymupdf google-genai

      - name: Convert uploaded PDFs to Markdown
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p pdf-output
          failed=()
          for f in pdf-input/*.pdf; do
            [ -e "$f" ] || continue
            base=$(basename "${f%.pdf}")
            if ! python3 tools/pdf_extractor.py "$f" --provider gemini -o "pdf-output/${base}.md"; then
              echo "::error::Failed to convert $f"
              failed+=("$f")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed to convert ${#failed[@]} file(s):"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Commit converted files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'pdf-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded PDFs to Markdown [skip ci]"
            git push
          fi
