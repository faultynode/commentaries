name: Convert AZW3s to Markdown

on:
  push:
    branches: [main]
    paths:
      - "azw3-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mobi ebooklib beautifulsoup4 markdownify

      - name: Convert uploaded AZW3s to Markdown
        run: |
          mkdir -p azw3-output
          for f in azw3-input/*.azw3; do
            [ -e "$f" ] || continue
            base=$(basename "${f%.azw3}")
            python3 tools/azw3_to_markdown.py "$f" -o "azw3-output/${base}.md"
          done

      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'azw3-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded AZW3s to Markdown [skip ci]"
            git push
          fi
