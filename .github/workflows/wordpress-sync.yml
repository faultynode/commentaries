name: Sync to WordPress

on:
  push:
    branches: [main]
    paths:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests python-frontmatter markdown beautifulsoup4

      - name: Sync markdown files to WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_ACCESS_TOKEN: ${{ secrets.WP_ACCESS_TOKEN }}
        run: python scripts/sync_wordpress.py

      - name: Regenerate index.html from front-matter titles
        run: python scripts/update_index.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' index.html
          if ! git diff --cached --quiet; then
            git commit -m "Record WordPress post IDs and regenerate index.html [skip ci]"
            git push
          fi
