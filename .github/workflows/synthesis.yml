name: Validate synthesis

# The model does not run here. Extraction and synthesis are scholarly acts
# that need a human in the loop and produce non-deterministic output; a
# record generated by CI would be one nobody read before it landed. What CI
# does is audit: it re-checks every quote against the commentary it claims
# to come from, re-checks every claimed absence, and rebuilds the derived
# artifacts so they can never drift from the records.

on:
  pull_request:
    paths:
      - "synthesis/**"
      - "commentaries/**"
      - "scripts/synthesis*.py"
      - ".github/workflows/synthesis.yml"
  push:
    branches: [main]
    paths:
      - "synthesis/**"
      - "commentaries/**"
      - "scripts/synthesis*.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # No pip install: the synthesis scripts are standard library only, so
      # this job cannot break on a dependency the WordPress sync happens to
      # pull in.
      - name: Validate records against the commentaries
        run: python3 scripts/synthesis_validate.py

  rebuild:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild index, ledgers and status
        run: |
          python3 scripts/synthesis_index.py
          python3 scripts/synthesis_ledger.py --all
          python3 scripts/synthesis_status.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- synthesis/corpus.json synthesis/ledgers synthesis/STATUS.md
          if git diff --cached --quiet; then
            echo "nothing to regenerate"
            exit 0
          fi
          # [skip ci] keeps this out of the WordPress sync, which triggers on
          # every **.md push - synthesis/ledgers/*.md would otherwise start a
          # run that has nothing to publish.
          git commit -m "Rebuild synthesis ledgers and status [skip ci]"
          for delay in 0 2 4 8 16; do
            sleep "$delay"
            git pull --rebase origin main && git push && exit 0
          done
          echo "push failed after retries" >&2
          exit 1
