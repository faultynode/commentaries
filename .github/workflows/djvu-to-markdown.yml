name: Convert DjVus to Markdown

on:
  push:
    branches: [main]
    paths:
      - "djvu-input/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y djvulibre-bin

      - name: Convert uploaded DjVus to Markdown
        run: |
          mkdir -p djvu-output
          for f in djvu-input/*.djvu; do
            [ -e "$f" ] || continue
            base=$(basename "${f%.djvu}")
            python3 tools/djvu_to_markdown.py "$f" -o "djvu-output/${base}.md"
          done

      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'djvu-output/*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Convert uploaded DjVus to Markdown [skip ci]"
            git push
          fi
